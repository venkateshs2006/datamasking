<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
</head>
<body>
<h1>User Management</h1>

<h2>Add/Update User</h2>
<form id="user-form">
    <input type="hidden" id="user-id">
    <label for="username">Username:</label>
    <input type="text" id="username" required><br>
    <label for="password">Password:</label>
    <input type="password" id="password"><br>
    <label for="role">Role:</label>
    <input type="text" id="role" required><br>
    <label for="departments">Departments (comma-separated):</label>
    <input type="text" id="departments" required><br>
    <button type="submit">Save User</button>
</form>

<h2>Users</h2>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Departments</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="user-table-body">
    </tbody>
</table>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const userForm = document.getElementById('user-form');
        const userTableBody = document.getElementById('user-table-body');

        // Fetch and display users
        function fetchUsers() {
            fetch('/api/users')
                .then(response => response.json())
                .then(users => {
                    userTableBody.innerHTML = '';
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.role.name}</td>
                            <td>${user.departments.map(d => d.name).join(', ')}</td>
                            <td>
                                <button onclick="editUser(${user.id}, '${user.username}', '${user.role.name}', '${user.departments.map(d => d.name).join(',')}')">Edit</button>
                                <button onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        `;
                        userTableBody.appendChild(row);
                    });
                });
        }

        // Handle form submission for creating/updating users
        userForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const userId = document.getElementById('user-id').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const departments = document.getElementById('departments').value.split(',').map(s => s.trim());

            const userRequest = {
                username,
                password,
                role,
                departments
            };

            const url = userId ? `/api/users/${userId}` : '/api/users';
            const method = userId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userRequest)
            }).then(() => {
                fetchUsers();
                userForm.reset();
            });
        });

        // Edit user
        window.editUser = function (id, username, role, departments) {
            document.getElementById('user-id').value = id;
            document.getElementById('username').value = username;
            document.getElementById('role').value = role;
            document.getElementById('departments').value = departments;
        };

        // Delete user
        window.deleteUser = function (id) {
            if (confirm('Are you sure you want to delete this user?')) {
                fetch(`/api/users/${id}`, {
                    method: 'DELETE'
                }).then(() => fetchUsers());
            }
        };

        fetchUsers();
    });
</script>
</body>
</html>
