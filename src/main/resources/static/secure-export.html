<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNP Paribas - SeEDM Secure Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bnp-emerald: #00965e; --bnp-dark-grey: #333333; --bnp-light-grey: #f4f4f4; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--bnp-light-grey); color: #4a4a4a; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
        #storage-options-container > div { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<header class="border-t-5 border-[var(--bnp-emerald)] p-4 sm:px-8 flex justify-between items-center bg-white shadow-md sticky top-0 z-1000">
    <div class="flex items-center">
        <a href="/index.html" class="logo-link mr-6">
            <img src="https://cdn-group.bnpparibas.com/build/images/logo-bnp.svg" alt="BNP Paribas Logo" class="h-12">
        </a>
        <div class="hidden md:block border-l border-gray-300 pl-6">
            <h1 class="text-xl font-bold text-[var(--bnp-dark-grey)] tracking-tight leading-none">SeEDM</h1>
            <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest mt-0.5">Secure Data Export</p>
        </div>
    </div>
    <nav>
        <ul class="flex list-none items-center m-0 p-0">
            <li class="ml-6"><a href="/index.html" class="text-decoration-none text-[var(--bnp-dark-grey)] font-semibold text-sm uppercase hover:text-[var(--bnp-emerald)]"><i class="fas fa-tachometer-alt mr-1.5"></i> Dashboard</a></li>
            <li class="ml-6"><a href="/jobs.html" class="text-decoration-none text-[var(--bnp-dark-grey)] font-semibold text-sm uppercase hover:text-[var(--bnp-emerald)]"><i class="fas fa-tasks mr-1.5"></i> Jobs</a></li>
            <li class="ml-6"><button onclick="logout()" class="text-decoration-none text-[var(--bnp-dark-grey)] font-semibold text-sm uppercase hover:text-[var(--bnp-emerald)] bg-none border-none cursor-pointer"><i class="fas fa-sign-out-alt mr-1.5"></i> Sign Out</button></li>
        </ul>
    </nav>
</header>

<main class="flex-1 p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="card p-6 sm:p-8">
            <h2 class="text-2xl font-bold text-[var(--bnp-dark-grey)] tracking-tight mb-2">Create Secure Export Job</h2>
            <p class="text-sm text-gray-500 mb-6">Anonymize data from a source database and export it to a secure location.</p>

            <form id="secure-export-form">
                <div class="space-y-6">
                    <!-- Source Database -->
                    <div>
                        <label for="source-db" class="block text-sm font-medium text-gray-700 mb-1">Source Database</label>
                        <select id="source-db" name="source-db" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-[var(--bnp-emerald)] focus:border-[var(--bnp-emerald)] text-sm bg-white shadow-sm cursor-pointer">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>

                    <!-- Storage Type -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Storage Type</label>
                        <div class="flex gap-4">
                            <label><input type="radio" name="storage-type" value="cos" checked> Cloud Object Storage</label>
                            <label><input type="radio" name="storage-type" value="local"> Local Storage</label>
                        </div>
                    </div>

                    <!-- Storage Options -->
                    <div id="storage-options-container">
                        <div id="cos-storage-option">
                            <label for="cos-connection" class="block text-sm font-medium text-gray-700 mb-1">COS Connection</label>
                            <select id="cos-connection" name="cos-connection" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-[var(--bnp-emerald)] focus:border-[var(--bnp-emerald)] text-sm bg-white shadow-sm cursor-pointer">
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>
                        <div id="local-storage-option">
                            <label for="local-path" class="block text-sm font-medium text-gray-700 mb-1">Local Path</label>
                            <input type="text" id="local-path" name="local-path" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-[var(--bnp-emerald)] focus:border-[var(--bnp-emerald)]" placeholder="e.g., /path/to/backups">
                        </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-200 text-right">
                    <button type="submit" class="bg-[var(--bnp-emerald)] text-white font-bold py-2 px-6 rounded-lg hover:opacity-90 transition-opacity">
                        <i class="fas fa-paper-plane mr-2"></i>Submit for Approval
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="bg-[var(--bnp-dark-grey)] text-white p-10 text-sm mt-auto">
    <div class="max-w-7xl mx-auto flex justify-between items-center opacity-80">
        <p>© BNP Paribas - 2026</p>
        <p class="font-light tracking-wider">The bank for a changing world</p>
    </div>
</footer>

<script>
    async function logout() {
        await fetch('/api/auth/logout', {method: 'POST'});
        window.location.href = '/login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Populate source database dropdown
        fetch('/api/connections?dbType=postgres&envType=source')
            .then(response => response.json())
            .then(connections => {
                const dbSelect = document.getElementById('source-db');
                dbSelect.innerHTML = '<option value="">-- Select a Database --</option>';
                connections.forEach(conn => {
                    const option = new Option(`${conn.name} (${conn.dbType})`, conn.id);
                    dbSelect.add(option);
                });
            })
            .catch(error => {
                console.error('Error fetching database connections:', error);
                document.getElementById('source-db').innerHTML = '<option value="">Could not load databases</option>';
            });

        // Populate COS connections dropdown
        fetch('/api/cos-connections?envType=destination')
            .then(response => response.json())
            .then(connections => {
                const cosSelect = document.getElementById('cos-connection');
                cosSelect.innerHTML = '<option value="">-- Select a COS Connection --</option>';
                connections.forEach(conn => {
                    const option = new Option(conn.cosName, conn.id);
                    cosSelect.add(option);
                });
            })
            .catch(error => {
                console.error('Error fetching COS connections:', error);
                document.getElementById('cos-connection').innerHTML = '<option value="">Could not load connections</option>';
            });

        // Handle storage type switching
        const storageTypeRadios = document.querySelectorAll('input[name="storage-type"]');
        const cosOption = document.getElementById('cos-storage-option');
        const localOption = document.getElementById('local-storage-option');

        function toggleStorageOptions() {
            if (document.querySelector('input[name="storage-type"]:checked').value === 'cos') {
                cosOption.style.display = 'block';
                localOption.style.display = 'none';
            } else {
                cosOption.style.display = 'none';
                localOption.style.display = 'block';
            }
        }
        toggleStorageOptions(); // Initial call
        storageTypeRadios.forEach(radio => radio.addEventListener('change', toggleStorageOptions));

        // Handle form submission
        const form = document.getElementById('secure-export-form');
        form.addEventListener('submit', event => {
            event.preventDefault();

            const sourceDb = document.getElementById('source-db').value;
            const storageType = document.querySelector('input[name="storage-type"]:checked').value;

            let jobData = {
                sourceConnectionId: sourceDb,
                storageType: storageType
            };

            if (storageType === 'cos') {
                jobData.cosConnectionId = document.getElementById('cos-connection').value;
            } else {
                jobData.localPath = document.getElementById('local-path').value;
            }

            if (!sourceDb || (storageType === 'cos' && !jobData.cosConnectionId) || (storageType === 'local' && !jobData.localPath)) {
                alert('Please fill out all fields.');
                return;
            }

            fetch('/api/secure-export/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jobData)
            })
            .then(response => {
                if (response.ok) {
                    alert('Secure export job submitted for approval!');
                    window.location.href = '/jobs.html';
                } else {
                    response.text().then(text => alert('Error: ' + text));
                }
            })
            .catch(error => {
                console.error('Error submitting job:', error);
                alert('An unexpected error occurred.');
            });
        });
    });
</script>

</body>
</html>
