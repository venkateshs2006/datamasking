<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNP Paribas - Anonify Secure Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bnp-emerald: #00965e; --bnp-dark-grey: #333333; --bnp-light-grey: #f4f4f4; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--bnp-light-grey); color: #4a4a4a; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<header class="border-t-5 border-[var(--bnp-emerald)] p-4 sm:px-8 flex justify-between items-center bg-white shadow-md sticky top-0 z-1000">
    <div class="flex items-center">
        <a href="/index.html" class="logo-link mr-6">
            <img src="https://cdn-group.bnpparibas.com/build/images/logo-bnp.svg" alt="BNP Paribas Logo" class="h-12">
        </a>
        <div class="hidden md:block border-l border-gray-300 pl-6">
            <h1 class="text-xl font-bold text-[var(--bnp-dark-grey)] tracking-tight leading-none">Anonify</h1>
            <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest mt-0.5">Secure Data Export</p>
        </div>
    </div>
    <nav>
        <ul class="flex list-none items-center m-0 p-0">
            <li id="navNewMigration" style="display: none;"><a href="/select-db.html"><i class="fas fa-plus mr-1.5"></i> New Migration</a></li>
            <li id="navDashboard"><a href="/index.html"><i class="fas fa-desktop mr-1.5"></i> Dashboard</a></li>
            <li id="navJobs"><a href="/jobs.html"><i class="fas fa-tasks mr-1.5"></i> Jobs</a></li>
            <li id="adminDbLink" style="display: none;"><a href="/admin-db.html"><i class="fas fa-database mr-1.5"></i> DB Admin</a></li>
            <li id="adminCosLink" style="display: none;"><a href="/admin-cos.html"><i class="fas fa-cloud mr-1.5"></i> COS Admin</a></li>
            <li id="userManagementLink" style="display: none;"><a href="/users.html"><i class="fas fa-users mr-1.5"></i> Users</a></li>
            <li><button onclick="logout()"><i class="fas fa-sign-out-alt mr-1.5"></i> Sign Out</button></li>
        </ul>
    </nav>
</header>

<main class="flex-1 p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="card p-6 sm:p-8">
            <h2 class="text-2xl font-bold text-[var(--bnp-dark-grey)] tracking-tight mb-2">Create Secure Export Job - Step 4: Review</h2>
            <p class="text-sm text-gray-500 mb-6">Review the configuration and submit the job for approval.</p>

            <div id="review-container">
                <!-- Review details will be populated by JavaScript -->
            </div>

            <div class="mt-8 pt-6 border-t border-gray-200 flex justify-between">
                <button type="button" onclick="window.history.back()" class="text-gray-600 font-bold py-2 px-6 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </button>
                <button type="button" onclick="submitJob()" class="bg-[var(--bnp-emerald)] text-white font-bold py-2 px-6 rounded-lg hover:opacity-90 transition-opacity">
                    <i class="fas fa-paper-plane mr-2"></i> Submit for Approval
                </button>
            </div>
        </div>
    </div>
</main>

<footer class="bg-[var(--bnp-dark-grey)] text-white p-10 text-sm mt-auto">
    <div class="max-w-7xl mx-auto flex justify-between items-center opacity-80">
        <p>© BNP Paribas - 2026</p>
        <p class="font-light tracking-wider">The bank for a changing world</p>
    </div>
</footer>

<script>
    let userRole = '';

    fetch('/api/auth/check').then(r => r.json()).then(data => {
        if(!data.authenticated) {
            window.location.href = '/login.html';
            return;
        }
        userRole = (data.role || '').toUpperCase();

        if (userRole !== 'APPROVER') {
            const newMig = document.getElementById('navNewMigration');
            if (newMig) newMig.style.display = 'block';
        }
        if (userRole === 'ADMIN' || userRole === 'MANAGER') {
            const dbLink = document.getElementById('adminDbLink');
            const cosLink = document.getElementById('adminCosLink');
            if (dbLink) dbLink.style.display = 'block';
            if (cosLink) cosLink.style.display = 'block';
        }
        if (userRole === 'ADMIN') {
            const userLink = document.getElementById('userManagementLink');
            if (userLink) userLink.style.display = 'block';
        }
    });

    async function logout() {
        await fetch('/api/auth/logout', {method: 'POST'});
        window.location.href = '/login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const config = JSON.parse(sessionStorage.getItem('secureExportConfig'));
        if (!config) {
            window.location.href = '/secure-export.html';
            return;
        }

        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = `
            <h3 class="text-lg font-bold mb-2">Configuration Summary</h3>
            <p><strong>Source Database ID:</strong> ${config.sourceConnectionId}</p>
            <p><strong>Schema:</strong> ${config.schema}</p>
            <p><strong>Storage Type:</strong> ${config.storageType}</p>
            ${config.storageType === 'cos' ? `<p><strong>COS Connection ID:</strong> ${config.cosConnectionId}</p>` : ''}
            ${config.storageType === 'local' ? `<p><strong>Local Path:</strong> ${config.localPath}</p>` : ''}
            <h4 class="text-md font-bold mt-4">Selected Tables:</h4>
            <ul class="list-disc list-inside">
                ${config.tables.map(table => `<li>${table}</li>`).join('')}
            </ul>
            <h4 class="text-md font-bold mt-4">Masking Rules:</h4>
            <pre class="bg-gray-100 p-4 rounded mt-2 text-xs">${JSON.stringify(config.rules, null, 2)}</pre>
        `;
    });

    function submitJob() {
        const config = JSON.parse(sessionStorage.getItem('secureExportConfig'));

        fetch('/api/secure-export/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(config)
        })
        .then(response => {
            if (response.ok) {
                alert('Secure export job submitted for approval!');
                sessionStorage.removeItem('secureExportConfig');
                window.location.href = '/jobs.html';
            } else {
                response.text().then(text => alert('Error: ' + text));
            }
        })
        .catch(error => {
            console.error('Error submitting job:', error);
            alert('An unexpected error occurred.');
        });
    }
</script>

</body>
</html>
