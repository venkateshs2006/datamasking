<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeEDM - Table Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .status-badge { padding: 4px 12px; border-radius: 9999px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
        .status-completed { background-color: #d1fae5; color: #065f46; }
        .status-running { background-color: #dbeafe; color: #1e40af; }
        .status-failed { background-color: #fee2e2; color: #991b1b; }
        .status-pending { background-color: #f3f4f6; color: #4b5563; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Sidebar -->
    <div class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white transition-transform duration-300 transform z-30">
        <div class="flex items-center justify-center h-16 border-b border-gray-800">
            <h1 class="text-2xl font-bold tracking-wider"><i class="fas fa-database mr-2 text-blue-500"></i>SeEDM</h1>
        </div>
        <nav class="mt-6">
            <a href="index.html" id="navDashboard" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-gray-100 transition-colors text-gray-400">
                <i class="fas fa-tachometer-alt w-6"></i>
                <span class="mx-3">Dashboard</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 bg-gray-800 border-l-4 border-blue-500 text-gray-100">
                <i class="fas fa-table w-6"></i>
                <span class="mx-3">Tables</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-gray-100 transition-colors text-gray-400">
                <i class="fas fa-cogs w-6"></i>
                <span class="mx-3">Settings</span>
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="ml-64 p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">Table Migration Status</h2>
                <p class="text-gray-500 mt-1" id="subtitle">Detailed breakdown of all tables</p>
            </div>
            <div class="flex space-x-2">
                <button onclick="filterTable('ALL')" class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm font-medium transition-colors">All</button>
                <button onclick="filterTable('COMPLETED')" class="px-4 py-2 bg-green-50 border border-green-200 text-green-700 rounded-lg hover:bg-green-100 text-sm font-medium transition-colors">Completed</button>
                <button onclick="filterTable('RUNNING')" class="px-4 py-2 bg-blue-50 border border-blue-200 text-blue-700 rounded-lg hover:bg-blue-100 text-sm font-medium transition-colors">Running</button>
                <button onclick="filterTable('FAILED')" class="px-4 py-2 bg-red-50 border border-red-200 text-red-700 rounded-lg hover:bg-red-100 text-sm font-medium transition-colors">Failed</button>
            </div>
        </div>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- Status Chart -->
            <div class="card p-6">
                <h3 class="text-lg font-semibold mb-4 text-gray-700">Status Distribution</h3>
                <div class="relative h-48">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- Counts -->
            <div class="card p-6 lg:col-span-2 flex flex-col justify-center">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="p-4 bg-green-50 rounded-xl border border-green-100">
                        <div class="text-3xl font-bold text-green-600" id="countCompleted">0</div>
                        <div class="text-xs font-semibold text-green-800 uppercase tracking-wide mt-1">Completed</div>
                    </div>
                    <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                        <div class="text-3xl font-bold text-blue-600" id="countRunning">0</div>
                        <div class="text-xs font-semibold text-blue-800 uppercase tracking-wide mt-1">In Progress</div>
                    </div>
                    <div class="p-4 bg-red-50 rounded-xl border border-red-100">
                        <div class="text-3xl font-bold text-red-600" id="countFailed">0</div>
                        <div class="text-xs font-semibold text-red-800 uppercase tracking-wide mt-1">Failed</div>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
                        <div class="text-3xl font-bold text-gray-600" id="countPending">0</div>
                        <div class="text-xs font-semibold text-gray-800 uppercase tracking-wide mt-1">Pending</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detailed Table -->
        <div class="card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                            <th class="px-6 py-4 font-semibold">Table Name</th>
                            <th class="px-6 py-4 font-semibold">Status</th>
                            <th class="px-6 py-4 font-semibold text-right">Read Count</th>
                            <th class="px-6 py-4 font-semibold text-right">Write Count</th>
                            <th class="px-6 py-4 font-semibold w-1/4">Progress</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="tableBody">
                        <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Loading tables...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Chart Setup
        const ctx = document.getElementById('statusChart').getContext('2d');
        const statusChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Completed', 'In Progress', 'Failed', 'Pending'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#10b981', '#3b82f6', '#ef4444', '#e5e7eb'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } }
                },
                cutout: '70%'
            }
        });

        // State
        let allTables = [];
        let currentFilter = 'ALL';
        const urlParams = new URLSearchParams(window.location.search);
        const executionId = urlParams.get('executionId');

        // Update Dashboard Link
        if (executionId) {
            document.getElementById('navDashboard').href = `index.html?executionId=${executionId}`;
            document.getElementById('subtitle').textContent = `Execution ID: ${executionId}`;
        }

        // Initialize
        async function init() {
            try {
                // 1. Fetch all tables first
                const tablesResp = await fetch('/api/migration/tables');
                const tablesData = await tablesResp.json();

                // Initialize state
                allTables = tablesData.tables.map(t => ({
                    name: t,
                    status: 'PENDING',
                    read: 0,
                    write: 0
                }));

                renderTable();
                updateStats();

                // 2. If execution ID exists, start polling
                if (executionId) {
                    pollStatus();
                    setInterval(pollStatus, 5000);
                }
            } catch (e) {
                console.error("Init failed", e);
            }
        }

        async function pollStatus() {
            try {
                const resp = await fetch(`/api/migration/status/${executionId}`);
                const data = await resp.json();

                if (data.tableProgress) {
                    // Update local state
                    data.tableProgress.forEach(p => {
                        const idx = allTables.findIndex(t => t.name === p.tableName);
                        if (idx !== -1) {
                            allTables[idx].status = p.status;
                            allTables[idx].read = p.readCount;
                            allTables[idx].write = p.writeCount;
                        }
                    });
                    updateStats();
                    renderTable();
                }
            } catch (e) {
                console.error("Poll failed", e);
            }
        }

        function updateStats() {
            const completed = allTables.filter(t => t.status === 'COMPLETED').length;
            const failed = allTables.filter(t => t.status === 'FAILED' || t.status === 'ABANDONED').length;
            const running = allTables.filter(t => t.status === 'STARTED' || t.status === 'STARTING').length;
            const pending = allTables.filter(t => t.status === 'PENDING').length;

            document.getElementById('countCompleted').textContent = completed;
            document.getElementById('countFailed').textContent = failed;
            document.getElementById('countRunning').textContent = running;
            document.getElementById('countPending').textContent = pending;

            statusChart.data.datasets[0].data = [completed, running, failed, pending];
            statusChart.update();
        }

        function filterTable(status) {
            currentFilter = status;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const filtered = allTables.filter(t => {
                if (currentFilter === 'ALL') return true;
                if (currentFilter === 'COMPLETED') return t.status === 'COMPLETED';
                if (currentFilter === 'FAILED') return t.status === 'FAILED' || t.status === 'ABANDONED';
                if (currentFilter === 'RUNNING') return t.status === 'STARTED' || t.status === 'STARTING';
                return true;
            });

            filtered.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors border-b border-gray-100';

                let badgeClass = 'status-pending';
                let progressColor = 'bg-gray-200';
                let progressWidth = 0;

                if (t.status === 'COMPLETED') {
                    badgeClass = 'status-completed';
                    progressColor = 'bg-green-500';
                    progressWidth = 100;
                } else if (t.status === 'FAILED' || t.status === 'ABANDONED') {
                    badgeClass = 'status-failed';
                    progressColor = 'bg-red-500';
                    progressWidth = 100;
                } else if (t.status === 'STARTED' || t.status === 'STARTING') {
                    badgeClass = 'status-running';
                    progressColor = 'bg-blue-500';
                    progressWidth = 50; // Indeterminate
                }

                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-gray-900">${t.name}</td>
                    <td class="px-6 py-4"><span class="status-badge ${badgeClass}">${t.status}</span></td>
                    <td class="px-6 py-4 text-right text-gray-600 font-mono">${t.read.toLocaleString()}</td>
                    <td class="px-6 py-4 text-right text-gray-600 font-mono">${t.write.toLocaleString()}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <div class="w-full bg-gray-200 rounded-full h-2 mr-2">
                                <div class="${progressColor} h-2 rounded-full transition-all duration-500" style="width: ${progressWidth}%"></div>
                            </div>
                            <span class="text-xs text-gray-500 font-medium">${progressWidth}%</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        init();
    </script>
</body>
</html>
