spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: seedm db migration

  datasource:
    # Batch Metadata Database Configuration (Primary)
    batchdb:
      url: jdbc:postgresql://localhost:5432/batch_db
      username: postgres
      password: Mannit@12345
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

    # Source Database Configuration (Read-only)
    source:
      url: jdbc:postgresql://localhost:5432/dvdrental
      username: postgres
      password: Mannit@12345
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

    # Destination Database Configuration (Write)
    destination:
      url: jdbc:postgresql://localhost:5432/destination_db
      username:  postgres
      password: Mannit@12345
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

  # Spring Batch Configuration
  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:batch-schema.sql
      table-prefix: BATCH_
    job:
      enabled: false  # Disable auto-start of the migration job on application startup

  # JPA Configuration (for Spring Batch metadata)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false



# Server Configuration
server:
  port: 8080

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.migrator: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/seedm-platform.log
    max-size: 10MB
    max-history: 30

# Application Specific Configuration
seedm:
  # Migration Configuration
  migration:
    source:
      schema: public  # Source schema name
    destination:
      schema: public  # Destination schema name
    chunk-size: 1000  # Number of rows per batchmigration:
    default-chunk-size: 1000
    default-thread-count: 50
    max-retry-attempts: 3
    checkpoint-interval: 1000
    masking-columns: actor.first_name,actor.last_name, flim.title, customer.first_name, customer.last_name, customer.email
    masking-constraints: actor.actor_id,address.address_id,address.city_id, category.category_id, city.city_id, city.country_id, country.country_id, customer.customer_id, customer.address_id, film.film_id,film_actor.actor_id, film_actor.film_id, film_category.film_id, film_category.category_id, inventory.inventory_id, inventory.film_id,payment.payment_id, payment.customer_id
    masking-key: SecretKey123