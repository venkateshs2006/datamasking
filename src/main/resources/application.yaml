spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: seedm db migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

  cloud:
    vault:
      uri: https://localhost:8200
      authentication: CERT
      ssl:
        key-store: classpath:vault.p12
        key-store-password: your-keystore-password
        trust-store: classpath:vault.p12
        trust-store-password: your-truststore-password

  datasource:
    # Batch Metadata Database Configuration (Primary)
    batchdb:
      url: jdbc:postgresql://localhost:5432/batch_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

    # Source Database Configuration (Read-only)
    source:
      url: jdbc:postgresql://localhost:5432/source_db
      username: '{vault.secret.database.source.username}'
      password: '{vault.secret.database.source.password}'
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

    # Destination Database Configuration (Write)
    destination:
      url: jdbc:postgresql://localhost:5432/destination_db
      username: '{vault.secret.database.destination.username}'
      password: '{vault.secret.database.destination.password}'
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

  # Spring Batch Configuration
  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:batch-schema.sql
      table-prefix: BATCH_
    job:
      enabled: false  # Disable auto-start of the migration job on application startup

  # JPA Configuration (for Spring Batch metadata)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# Migration Configuration
migration:
  source:
    schema: public  # Source schema name
  destination:
    schema: public  # Destination schema name
  chunk-size: 1000  # Number of rows per batch

# Server Configuration
server:
  port: 8080

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.migrator: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/seedm-platform.log
    max-size: 10MB
    max-history: 30

# Application Specific Configuration
seedm:
  admin:
    username: admin
    password: password
  migration:
    source:
      schema: public
    destination:
      schema: public
    default-chunk-size: 1000
    default-thread-count: 50
    max-retry-attempts: 3
    checkpoint-interval: 1000
    masking-columns: testing.name,data.name
    masking-constraints: testing.id,testing.mydata_id,data.id
    partial-masking-columns:
    masking-key: SecretKey123
