version: '3.8'

services:
  # Source PostgreSQL Database
  postgres-source:
    image: postgres:16-alpine
    container_name: postgres-source
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
    ports:
      - "5432:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./init-source.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Destination PostgreSQL Database
  postgres-destination:
    image: postgres:16-alpine
    container_name: postgres-destination
    environment:
      POSTGRES_DB: destination_db
      POSTGRES_USER: dest_user
      POSTGRES_PASSWORD: dest_password
    ports:
      - "5433:5432"
    volumes:
      - dest_data:/var/lib/postgresql/data
      - ./init-destination.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dest_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migration Application
  migrator-app:
    build: .
    container_name: anonify
    depends_on:
      postgres-source:
        condition: service_healthy
      postgres-destination:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_SOURCE_URL: jdbc:postgresql://postgres-source:5432/source_db
      SPRING_DATASOURCE_SOURCE_USERNAME: source_user
      SPRING_DATASOURCE_SOURCE_PASSWORD: source_password

      SPRING_DATASOURCE_DESTINATION_URL: jdbc:postgresql://postgres-destination:5432/destination_db
      SPRING_DATASOURCE_DESTINATION_USERNAME: dest_user
      SPRING_DATASOURCE_DESTINATION_PASSWORD: dest_password

      MIGRATION_SOURCE_SCHEMA: public
      MIGRATION_DESTINATION_SCHEMA: public
      MIGRATION_CHUNK_SIZE: 1000
    ports:
      - "8080:8080"

volumes:
  source_data:
  dest_data: